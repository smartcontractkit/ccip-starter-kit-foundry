[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = '0.8.26'
# Deployed CCIP 2.0 contracts use opcodes unavailable to Paris script simulations.
evm_version = 'cancun'
# Fork tests need RPC URLs and pinned blocks, so `forge test` skips them. Run them with FOUNDRY_PROFILE=fork.
no_match_path = 'test/fork/**'

[profile.cct]
optimizer = true
optimizer_runs = 200

# Fork tests (test/fork): pool deployment needs the optimizer, same as the cct profile.
[profile.fork]
optimizer = true
optimizer_runs = 200
no_match_path = 'test/none/**'
match_path = 'test/fork/**'

[rpc_endpoints]
ethereumSepolia = "${ETHEREUM_SEPOLIA_RPC_URL}"
avalancheFuji = "${AVALANCHE_FUJI_RPC_URL}"
polygonAmoy = "${POLYGON_AMOY_RPC_URL}"
baseSepolia = "${BASE_SEPOLIA_RPC_URL}"

[profile.lint.lint]
exclude_lints = [
    "mixed-case-variable",
    "pascal-case-struct",
    "mixed-case-function",
    "screaming-snake-case-immutable",
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
